# virp-onode-home.dropin.conf — the home node's differences from the
# base O-Node unit, and nothing else.
#
# Installs to /etc/systemd/system/virp-onode.service.d/40-home.conf on
# virp-onode-home (10.0.0.13), node_id 0x0000000D.
#
# ── Why a drop-in and not a second unit ──────────────────────────────
#
# The first attempt at tracking this node wrote a whole second unit
# file, deploy/virp-onode-home.service, mapping to the SAME installed
# path as deploy/virp-onode.service. That immediately collided with
# unit-manifest.txt, which maps one tracked file per installed path, and
# with scripts/check-unit-drift.sh, which then refused a tracked unit
# named in no manifest entry.
#
# The manifest already had the answer written in it:
#
#     Host-specific settings do NOT belong here and do NOT belong as
#     edits to a tracked unit. They belong in a DROP-IN, which is itself
#     tracked and listed below.
#
# So the base unit is byte-identical on both nodes, this file carries
# the three real differences, the manifest stays one-to-one, and
# drift-check.sh stops reporting the home node's unit as drifted from a
# unit it was never meant to equal.
#
# ── What adopting the base unit changes on this node ─────────────────
#
# The hand-written unit this replaces had NO sandboxing at all: no
# NoNewPrivileges, no ProtectSystem, no ProtectHome, no PrivateTmp, no
# RestrictAddressFamilies, and RuntimeDirectoryMode=0755 where the base
# uses 0750. The base unit brings all of it. That is a real hardening
# change riding along with a tracking change, and it is called out here
# rather than buried: it is the fix for Phase 0 finding D3, and it takes
# effect at the same restart as everything else.
#
# The base unit also adds ExecStartPre=+render-devices.sh, which is what
# moves this node's fleet out of a hand-edited /etc/virp/devices.json
# and into deploy/devices.home.template.json. That REQUIRES
# /etc/virp/autopilot.env with the four credentials that template names,
# or the render is FATAL and the daemon does not start.
#
# ── NODE PREREQUISITE: virp's home must be /var/lib/virp ─────────────
#
# The base unit sets ProtectHome=yes, which replaces /home with an empty
# tmpfs for the service. The SSH driver resolves its host-key store from
# the account's home directory, so if virp's home is under /home the
# daemon cannot read known_hosts and EVERY ssh device fails with
#
#     [SSH-HK] Unknown host key for 10.0.0.35:22 — not in
#              /home/virp/.virp/known_hosts
#
# which is what happened on this node at first install: connected went
# 2/38 -> 0/38 and the two reachable devices dropped. virp-lab has never
# hit it because its virp account has always had /var/lib/virp as its
# home, which is also the StateDirectory the unit grants ReadWritePaths
# to. This node was converged onto that on 2026-09-03:
#
#     systemctl stop virp-onode virp-witness-tunnel   # both run as virp
#     cp -a /home/virp/.virp /home/virp/.ssh /var/lib/virp/
#     chmod 0700 /var/lib/virp/.virp
#     chmod 0600 /var/lib/virp/.virp/known_hosts*     # were 0664
#     usermod -d /var/lib/virp virp
#
# The 0664 is worth its own line: group virp contains virp-spark and
# virp-laptop, so the daemon's host-key store was writable by two
# identities that are otherwise deliberately confined to reads and
# proposals. Rewriting known_hosts is how host-key pinning gets turned
# off quietly. virp-lab keeps these 0600 and now so does this node.
#
# A node that has not had this done will start and then fail every
# device. It is a prerequisite of the base unit, not of this drop-in,
# which is why it is documented here rather than expressed as a setting:
# ProtectHome=read-only would paper over it and give up a real control.
#
# ── The three differences ────────────────────────────────────────────

[Unit]
Description=VIRP Observation Node Daemon (home — pve-lab and the GNS3 lab)

[Service]
# ExecStart= with an empty value CLEARS the base unit's list; without
# that line systemd would append and run the daemon twice.
#
# Two flags the colo node does not pass:
#   -S  the Ed25519 chain-signing key. This node signs its chain heads
#       (key_id c1104805, see deploy/keys/registry.json) and submits
#       them to the witness under the same key. The colo node has no
#       chain-signing keypair and signs heads with a symmetric K_chain
#       only.
#   -n  an explicit node id. The colo node takes the default 0x00000001;
#       this one must not, or two nodes' entries would be
#       indistinguishable by signer.
ExecStart=
ExecStart=/usr/local/lib/virp/virp-onode-prod \
    -k /etc/virp/keys/onode.key \
    -s /run/virp/onode.sock \
    -d /run/virp/devices.json \
    -c /var/lib/virp/chain.db \
    -C /etc/virp/keys/chain.key \
    -S /etc/virp/keys/chain-sign.key \
    -n 0x0000000D
