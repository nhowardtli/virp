# Drop-in for virp-onode.service — install as
#   /etc/systemd/system/virp-onode.service.d/50-config-backup.conf
#
# Re-grants the config-backup runbook's socket ACL every daemon start,
# because the socket (and /run/virp) are recreated each start and ACLs
# do not survive that. Lives on the DAEMON unit, not the runbook unit:
# the grant must track socket creation, and the runbook's own sandbox
# (ProtectSystem=strict) deliberately cannot reach /var/lib/virp to
# grant itself anything. The `+` runs as root inside this unit's
# namespace, where /run/virp and /var/lib/virp are writable.
# Fails the daemon start loudly if the virp-backup identity is missing
# or over-privileged — a mis-provisioned runbook identity is a deploy
# error, not something to limp past.
[Service]
ExecStartPost=+/opt/virp/deploy/config-backup-access.sh
