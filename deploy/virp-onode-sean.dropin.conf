# Drop-in for virp-onode.service — install as
#   /etc/systemd/system/virp-onode.service.d/53-sean.conf
#
# Re-grants the remote requester's (virp-sean, uid 987) socket ACL every
# daemon start, because the socket (and /run/virp) are recreated each
# start and ACLs do not survive that. Lives on the DAEMON unit, not the
# tunnel: the grant must track socket creation, and the serving sshd
# child holds no privilege to grant itself anything. The `+` runs as
# root inside this unit's namespace, where /run/virp is writable.
# Fails the daemon start loudly if the virp-sean identity is missing,
# carries the wrong uid, or is over-privileged — a mis-provisioned
# remote identity is a deploy error, not something to limp past.
#
# Numbered 53 so it orders after 50-config-backup.conf, 51-evidence.conf
# and 52-netclaw.conf; the four grants are independent and any may fail
# without masking the others.
#
# ORDERING AT INSTALL TIME: /usr/local/lib/virp/sean-access.sh must
# already exist when this drop-in lands, or the next daemon start fails
# its ExecStartPost. Install the script first, this file second, restart
# third.
[Service]
ExecStartPost=+/usr/local/lib/virp/sean-access.sh
