# VM219 only: demo key generated and retained on the VM. No witness flags.
[Service]
ExecStart=
ExecStart=/usr/local/lib/virp/virp-onode-prod -k /etc/virp/keys/onode.key -s /run/virp/onode.sock -d /run/virp/devices.json -c /var/lib/virp/chain.db -C /etc/virp/keys/chain.key -S /etc/virp/keys/demo-producer.key
