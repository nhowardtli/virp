# Drop-in for virp-onode.service — install as
#   /etc/systemd/system/virp-onode.service.d/52-netclaw.conf
#
# Re-grants the remote requester's (virp-netclaw) socket ACL every
# daemon start, because the socket (and /run/virp) are recreated each
# start and ACLs do not survive that. Lives on the DAEMON unit, not the
# tunnel: the grant must track socket creation, and the serving sshd
# child holds no privilege to grant itself anything. The `+` runs as
# root inside this unit's namespace, where /run/virp is writable.
# Fails the daemon start loudly if the virp-netclaw identity is missing
# or over-privileged — a mis-provisioned remote identity is a deploy
# error, not something to limp past.
#
# Numbered 52 so it orders after 50-config-backup.conf and
# 51-evidence.conf; the three grants are independent and any may fail
# without masking the others.
[Service]
ExecStartPost=+/usr/local/lib/virp/netclaw-access.sh
