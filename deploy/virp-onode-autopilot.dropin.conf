# Drop-in for virp-onode.service — install as
#   /etc/systemd/system/virp-onode.service.d/54-autopilot.conf
#
# Re-grants the autopilot identity's socket ACL every daemon start,
# because the socket (and /run/virp) are recreated each start and ACLs
# do not survive that. Same shape and reasons as 51-evidence.conf: the
# grant lives on the DAEMON unit because it must track socket creation,
# and the autopilot's own sandbox cannot grant itself anything.
# Fails the daemon start loudly if the virp-autopilot identity is
# missing, has the wrong uid, or is over-privileged.
#
# Numbered 54 so it orders after 53-sean.conf; the grants are independent.
[Service]
ExecStartPost=+/usr/local/lib/virp/autopilot-access.sh
