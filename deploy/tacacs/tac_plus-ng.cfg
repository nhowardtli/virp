#!/usr/local/sbin/tac_plus-ng
#
# VIRP TACACS+ AUTHENTICATION and AUTHORIZATION server.
#
#   THIS SERVER DOES NOT DO ACCOUNTING.
#
# Accounting stays on the VIRP receivers -- 313 at 10.0.0.13:4949 and
# .211 at 10.0.10.211:4949 -- and nothing here touches them. The
# separation is the point: docs/TACACS-ACCOUNTING.md 9.4 measures that
# an authorization outage still leaves accounting receipts arriving,
# because they are different processes on different addresses. Putting
# accounting here would collapse that into one failure domain and lose
# the only signal that survives an authz outage.
#
# There is deliberately no `accounting log` directive below. If one is
# ever added, 9.4 stops being true.
#
# Identities: two gate identities, plus human operator accounts.
#   virp-ro  priv 1  -- the GREEN table from src/drivers/driver_cisco.c
#   virp-rw  priv 15 -- nothing, until /etc/tacacs/approved.conf says so
#   nhoward  priv 15 -- every command permitted, via operator_profile
#
# HUMAN OPERATORS ARE ON THIS SERVER, and are deliberately NOT fenced by
# it. Their profile permits every command. It exists so that operator
# commands are DECISIONED and ACCOUNTED rather than invisible -- not so
# that they can be refused. Per docs/TACACS-ACCOUNTING.md 9.1.
#
# The console remains the recovery path: authentication `local`,
# authorization `none`. An authorization server that can lock an operator
# out of a device is the failure mode VIRP refused to build, and the
# console is the reason adding operator accounts here does not rebuild
# it -- if this server is unreachable the console is unaffected.
#
# That console list is load-bearing in a way it was not before. Until
# now no human depended on this server at all; now a human's VTY session
# does. Removing `authorization commands N CONSOLE none` from a device
# would convert a server outage into an operator lockout.

id = spawnd {
	listen { port = 49 }
	spawn {
		instances min = 1
		instances max = 8
	}

	# background = no IS LOad-BEARING. Do not "fix" this to yes.
	#
	# spawnd reloads by execve()ing itself (mavis/spawnd_signals.c:17).
	# execve preserves the pid -- but only if the process does not then
	# daemonize again. With `background = yes` the re-exec'd master
	# forks, so EVERY SIGHUP hands the master a NEW pid and rewrites the
	# pidfile under systemd. systemd goes on tracking the pid it read at
	# start, sees it vanish, and logs "Deactivated successfully" -- a
	# CLEAN exit, so Restart=on-failure does not fire and the
	# authorization server is silently gone. Measured: it died on the
	# second reload.
	#
	# In the foreground, execve keeps the pid, systemd's MainPID stays
	# valid across unlimited reloads, and the unit uses Type=exec with
	# no PIDFile at all.
	background = no
}

id = tac_plus-ng {

	# ------------------------------------------------------------------
	# Logging.
	#
	# `authorization log` is the whole reason this file exists in the
	# shape it does. Accounting CANNOT see a refusal: the router only
	# accounts what it ran, so a denied command produces no accounting
	# record anywhere. Until authorization decisions are chained, this
	# local file is the ONLY place a denial lands. Losing it loses the
	# denials silently, which is worse than not having the control.
	#
	# access log  = authentication outcomes (who logged in, who failed)
	# authorization log = every per-command decision, permit AND deny
	# ------------------------------------------------------------------
	log authz_file {
		destination = /var/log/tacacs/authz.log
	}
	log access_file {
		destination = /var/log/tacacs/access.log
	}
	authorization log = authz_file
	access log = access_file

	# ------------------------------------------------------------------
	# virp-ro -- priv 1, the GREEN table, exactly.
	# ------------------------------------------------------------------
	profile virp_ro_profile {
		script {
			if (service == shell) {
				# EXEC (shell login) authorization. priv-lvl 1:
				# virp-ro must never arrive at an enable prompt.
				if (cmd == "") {
					set priv-lvl = 1
					permit
				}

				# Hard denials FIRST. guard.conf refuses ';',
				# control bytes, shell metacharacters, and any
				# pipe modifier outside the closed display-only
				# list. A permit rule below can never reach a
				# command the guard already denied.
				include /etc/tacacs/guard.conf

				# Per-command authorization. The generated GREEN
				# rules permit; anything reaching the bottom of
				# the block is denied. Fail-closed by structure,
				# not by a default that could be edited away.
				include /etc/tacacs/green.conf

				deny
			}
			deny
		}
	}

	# ------------------------------------------------------------------
	# virp-rw -- priv 15, and NOTHING permitted until approved.conf says.
	#
	# approved.conf is the seam VIRP writes into for a bounded TTL. It
	# ships EMPTY and an empty file permits nothing: the `deny` below it
	# is unconditional, so an empty include leaves deny-all standing.
	#
	# The include is NOT optional and NOT globbed loosely. tac_plus-ng
	# treats a non-matching include as GLOB_NOMATCH -> parse error
	# (mavis/mavis_parse.c:764), so a DELETED approved.conf refuses the
	# whole config rather than quietly dropping the seam. The writer must
	# truncate the file, never unlink it. That failure direction is
	# correct and is relied upon.
	# ------------------------------------------------------------------
	profile virp_rw_profile {
		script {
			if (service == shell) {
				if (cmd == "") {
					set priv-lvl = 15
					permit
				}

				# The same floor applies to virp-rw. The
				# approved.conf writer is a machine and this is
				# the one thing it cannot grant its way past:
				# an approved "show version" can never become
				# "show version | redirect flash:x".
				include /etc/tacacs/guard.conf

				include /etc/tacacs/approved.conf

				deny
			}
			deny
		}
	}

	# ------------------------------------------------------------------
	# Human operators -- priv 15, EVERY command permitted.
	#
	# This profile deliberately does NOT include guard.conf. The guard is
	# a floor under the GATE, whose grants are written by a machine. A
	# human at priv 15 can already do anything the box can do, and a
	# metachar denial here would only produce a confusing refusal for a
	# command the same person could type at the console unimpeded.
	#
	# The point of routing operators through this server is VISIBILITY,
	# not restriction: a permit still lands in authz.log, so operator
	# commands are decisioned and accounted instead of invisible. Note
	# that any restriction added here would be advisory anyway, because
	# the console path (authorization none) bypasses it entirely.
	#
	# `\A.*\z` rather than a bare `permit`: same anchored idiom as
	# green.conf and guard.conf. `.` does not match a newline under
	# PCRE2 (MULTILINE affects ^ and $, not `.`), so a cmd carrying an
	# embedded newline does NOT match and falls through to the `deny`
	# below. That is fail-closed and intended.
	# ------------------------------------------------------------------
	profile operator_profile {
		script {
			if (service == shell) {
				if (cmd == "") {
					set priv-lvl = 15
					permit
				}
				if (cmd =~ /\A.*\z/) { permit }
				deny
			}
			deny
		}
	}

	# ------------------------------------------------------------------
	# Secrets. Included LAST, because it defines the `user` blocks and a
	# user may only reference a profile that already exists.
	#
	# secrets.conf holds the device shared keys and the two account
	# passwords. It is generated on the box, 0600 root:root, and is
	# NEVER committed -- deploy/tacacs/secrets.conf.example carries the
	# same structure with placeholders.
	#
	# A missing secrets.conf is a parse error, not a silent
	# no-authentication state. That is the correct direction.
	# ------------------------------------------------------------------
	include /etc/tacacs/secrets.conf
}
