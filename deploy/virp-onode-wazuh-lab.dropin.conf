# =============================================================================
# LAB ONLY — DISABLES WAZUH TLS CERTIFICATE VALIDATION
# =============================================================================
#
# This drop-in sets VIRP_WAZUH_INSECURE=1, which turns OFF certificate
# validation for the Wazuh driver (CURLOPT_SSL_VERIFYPEER=0,
# VERIFYHOST=0). A man-in-the-middle on the path to the Wazuh manager can
# then impersonate it and feed forged monitoring data.
#
# It exists solely because the LAB Wazuh manager (10.0.20.10) presents a
# self-signed certificate. NEVER install this against a Wazuh instance you
# care about — for a real manager, set VIRP_CA_BUNDLE to its signing CA in
# the main unit instead and leave validation ON.
#
# Installing this is a manual, documented act — it is deliberately NOT
# wired into any default install path, and `make check-deploy-unit`
# exempts only this file. To apply on a lab node:
#
#   mkdir -p /etc/systemd/system/virp-onode.service.d
#   cp deploy/virp-onode-wazuh-lab.dropin.conf \
#      /etc/systemd/system/virp-onode.service.d/wazuh-lab.conf
#   systemctl daemon-reload && systemctl restart virp-onode
#
# To revert: remove the drop-in, daemon-reload, restart.
# =============================================================================

[Service]
Environment=VIRP_WAZUH_INSECURE=1
