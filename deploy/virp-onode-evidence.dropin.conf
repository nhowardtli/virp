# Drop-in for virp-onode.service — install as
#   /etc/systemd/system/virp-onode.service.d/51-evidence.conf
#
# Re-grants the evidence collector's socket ACL every daemon start,
# because the socket (and /run/virp) are recreated each start and ACLs
# do not survive that. Lives on the DAEMON unit, not the collector unit:
# the grant must track socket creation, and the collector's own sandbox
# (ProtectSystem=strict) deliberately cannot reach /var/lib/virp to
# grant itself anything. The `+` runs as root inside this unit's
# namespace, where /run/virp and /var/lib/virp are writable.
# Fails the daemon start loudly if the virp-evidence identity is missing
# or over-privileged — a mis-provisioned collector identity is a deploy
# error, not something to limp past.
#
# Numbered 51 so it orders after 50-config-backup.conf; the two grants
# are independent and either may fail without masking the other.
[Service]
ExecStartPost=+/opt/virp/deploy/evidence-access.sh
