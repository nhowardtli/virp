# virp-sean: remote VIRP requester tunnel account for Sean's isolated
# agent VM (sean-agent, 10.0.70.10 on VLAN 70). Pubkey only, key held
# in root-owned /etc/ssh/authorized_keys.d/ so the account cannot enroll
# its own keys. The ONLY capability is streamlocal (Unix socket)
# forwarding, used to reach /run/virp/onode.sock; the daemon still gates
# by SO_PEERCRED uid (987), its action allowlist and its tier ceiling.
#
# OPENSSH 9.6 QUIRK (found live 2026-08-09 on the virp-netclaw seat):
# AllowTcpForwarding=no and PermitOpen=none each poison the SHARED
# local-perms list that direct-streamlocal connects are checked against,
# so either one also blocks the Unix-socket forward this account exists
# for (sshd logs "request was denied" without ever calling connect()).
# TCP forwarding is therefore left enabled HERE and denied one layer
# down by virp-sean-egress.service (nft: uid 987 may not originate IP
# connections) — re-prove that denial whenever this file or that unit
# changes. sshd has no per-path PermitOpen for Unix sockets — socket
# reach is bounded by filesystem perms (the ACL from sean-access.sh)
# plus the O-Node allowlist.
#
# The Address restriction is the second place 10.0.70.10 is pinned; the
# first is the from="10.0.70.10" option on the key itself. Both are
# deliberate: the key option travels with the key if this file is ever
# lost, and this block means a key leak alone does not open the seat
# from anywhere else. Neither is a substitute for the FortiGate policy,
# which is what actually keeps other hosts off VLAN 10.
Match User virp-sean Address 10.0.70.10
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    AuthorizedKeysFile /etc/ssh/authorized_keys.d/virp-sean
    AllowStreamLocalForwarding local
    AllowTcpForwarding yes
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitUserRC no
