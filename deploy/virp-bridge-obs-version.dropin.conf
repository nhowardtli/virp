# 50-obs-version.conf — drop-in for virp-bridge-mcp@.service
#
# EXECUTIVE ROLLBACK (2026-08-10): the bridge asks the O-Node for
# obs_version 1 (master-O-Key signing) instead of its code default of 2.
# v2 observations are session-key-signed and CANNOT be cryptographically
# re-verified at rest once the session is gone (the HKDF transcript
# lives only in daemon memory); at-rest verifiability wins until v2
# frames carry a persistent signature (dual-signing, Ed25519 direction —
# designed separately).
#
# The CODE default stays 2 on purpose: returning to the proven v2 wire
# path later is DELETING THIS FILE (+ daemon-reload), not a code change.
# Tracked as deploy/virp-bridge-obs-version.dropin.conf in the VIRP
# repo on this host (/opt/virp), installed at
# /etc/systemd/system/virp-bridge-mcp@.service.d/50-obs-version.conf.
[Service]
Environment=VIRP_OBS_VERSION=1
