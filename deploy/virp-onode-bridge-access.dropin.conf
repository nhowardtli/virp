# 53-bridge-access.conf — drop-in for virp-onode.service (netclaw)
#
# NCFED federation bridge socket reach. The `+` prefix runs as root
# outside the sandbox, like the device render. This grants uid
# virp-bridge traversal on /run/virp and rw on the socket — and
# NOTHING else. It is required IN ADDITION to virp-bridge's
# socket_allowed_uids entry: socket_allowed_uids is checked via
# SO_PEERCRED after accept(), which never happens if the kernel
# refuses connect() first (/run/virp is 0750 virp:virp). Remove this
# drop-in and the federated path goes dark; remove the allowlist
# entry and the daemon closes the connection on principle. Either
# alone is a full revocation of federated reach.
#
# Until 2026-08-11 this line lived as an untracked edit inside the
# installed virp-onode.service (drift the checker below flagged); it
# is now the tracked per-host drop-in the checker's own philosophy
# prescribes. Tracked as deploy/virp-onode-bridge-access.dropin.conf,
# installed at
# /etc/systemd/system/virp-onode.service.d/53-bridge-access.conf.
[Service]
ExecStartPost=+/usr/local/lib/virp/virp-bridge-access.sh
